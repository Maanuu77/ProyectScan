name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest

  executable:
    name: Windows executable
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build
        run: python packaging/build.py
      - name: Smoke test the executable on this repository
        shell: pwsh
        run: |
          # A windowed program: PowerShell does not wait for it to finish unless asked to.
          $app = Start-Process ./dist/repo-xray.exe -ArgumentList '.', '--export', 'smoke.zip' -Wait -PassThru -NoNewWindow
          if ($app.ExitCode -ne 0) { throw "The executable exited with code $($app.ExitCode)" }
          if (-not (Test-Path smoke.zip)) { throw "The executable did not write the zip" }
      - uses: actions/upload-artifact@v4
        with:
          name: repo-xray-windows
          path: dist/repo-xray.exe
          retention-days: 14
