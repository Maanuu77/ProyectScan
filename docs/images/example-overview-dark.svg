<svg xmlns="http://www.w3.org/2000/svg" width="1371.5" height="771" viewBox="0 0 1371.5 771" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Benchify: Visión general de la arquitectura</title>
<desc>Benchify está formado por backend (API, Spring Boot 4.1, Java 21), frontend (aplicación web, Angular 22, TypeScript 6). Usa Firebase Auth, PostgreSQL, Firebase Storage.</desc>
<rect x="0" y="0" width="1371.5" height="771" fill="#0d1117"/>
