<text x="98" y="50" font-size="11" font-weight="700" fill="#9198a1" letter-spacing="1">¿DE QUÉ ESTÁ HECHO?</text>
<text x="40" y="86" font-size="26" font-weight="700" fill="#f0f6fc">Benchify</text>
<text x="40" y="111" font-size="13" font-weight="400" fill="#9198a1">2 aplicaciones  ·  3 servicios  ·  31.1k líneas de código</text>
<text x="40" y="137" font-size="13" font-weight="400" fill="#f0f6fc">Mapa colaborativo de bancos públicos. Descubre bancos cerca de ti, valóralos, guárdalos en favoritos, haz check-in cuando te sientes en uno, comparte fotos y avisa si alguno está roto. Cada aportación</text>
<text x="40" y="157" font-size="13" font-weight="400" fill="#f0f6fc">pasa por moderación. En español e inglés, y se instala como aplicación.</text>
