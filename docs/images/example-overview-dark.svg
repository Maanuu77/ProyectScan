<text x="40" y="90" font-size="13" font-weight="400" fill="#9198a1">Visión general de la arquitectura  ·  2 aplicaciones  ·  3 servicios  ·  15.8k líneas de código</text>
<text x="40" y="118" font-size="13" font-weight="400" fill="#f0f6fc">Mapa colaborativo de bancos públicos. Descubre bancos cerca de ti, valóralos, guárdalos en favoritos, haz check-in cuando te sientes en uno y comparte fotos. Cada aportación pasa</text>
<text x="40" y="138" font-size="13" font-weight="400" fill="#f0f6fc">por moderación.</text>
