<title>Benchify: Visión general de la arquitectura</title>
<desc>Benchify está formado por backend (API, Spring Boot 4.1, Java 21), frontend (aplicación web, Angular 21, TypeScript 5). Usa Firebase Auth, PostgreSQL, Firebase Storage.</desc>
