[project]
name = "repo-xray"
version = "1.0.0"
description = "Architecture documentation generated from source code: overview, features and flows"
requires-python = ">=3.11"

[project.scripts]
repo-xray = "repo_xray.cli:main"

[tool.setuptools.packages.find]
include = ["repo_xray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
qt_api = "pyside6"

[tool.setuptools.package-data]
"repo_xray.app" = ["icon.svg"]
